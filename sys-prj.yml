test_envs:
  dep_root: ''
  deps: []

# `gops sys package` 排除（默认模式与 --full 都生效）
# `configs/` = 现场渲染出的配置（可重建、每部署一份）；`.wist/` = 密钥（绝不进包）。
pkg_exclude:
  - data-plane-run
  - identity
  - .wist
  - configs
  - .env
  - packages

# 现场态：升级/重建时不覆盖、不删除
protect:
  - data-plane-run
  - identity
  - configs
  - .env
  - packages
  - values

# 对外契约：站点身份（服务端证书 + 私钥 + 客户端 CA）。
# 换一份 = 所有网关都要换信任锚，所以整目录进 contract。
# ⚠ contract 归档含私钥：落点（ops-prj.yml: contract.target）必须离机/加密存放。
contract:
  - identity

# 备份取 backup 表。
#   `configs/` —— 渲染出的 ctrl 配置（模板在 sys/configs/**/*.tpl，丢了可重渲）
#   `.wist/`   —— 密钥文件（admin token 等）。**必须备**：配置里只有 `${SEC_*}` 占位，
#                 丢了它就等于丢了 token，还原时会换成另一份。
# `identity/` 不在这里：它走 `contract`（`gops prj contract export`），两者是两条通路。
# 注意：同一路径既在 contract 又在 backup 会触发 `contract.overlap` 诊断错误。
backup:
  - configs
  - .wist
  - data-plane-run

perms:
  services:
    ingest:
      uid: 999
      gid: 999

secrets:
  file: .wist/sec-value.yml
  mode: "0640"
