name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 栈本身不含二进制：镜像由 wist-ingest-ctrl / wist-ingest-web 各自流水线推送，
  # 数据面直接用上游 warp-parse 镜像。这里只做两件事：可发布性检查 + 打部署包。
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Render compose
        run: |
          docker compose --env-file .env.example \
            -f sys/docker-compose.yml --project-directory . config > /dev/null

      - name: Shellcheck
        run: |
          command -v shellcheck >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y shellcheck)
          shellcheck sys/scripts/*.sh dev/*.sh

  package:
    name: Package
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build tarball
        # 只打 git 跟踪的文件：identity/、data-plane-run/、.env、values/ 都是现场态，
        # 不进交付包（.gitignore 已挡住）。
        run: |
          name="wist-ingest-stack-${{ github.ref_name }}.tar.gz"
          git archive --format=tar.gz --prefix="wist-ingest-stack/" -o "$name" HEAD
          ls -l "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-ingest-stack
          path: wist-ingest-stack-*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: wist-ingest-stack-*.tar.gz
