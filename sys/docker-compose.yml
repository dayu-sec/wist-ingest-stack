# wist-ingest-stack — 数据面 warp-parse（TCP + mTLS） + 管理台
#
# 角色：
#   ingest  数据面，= 上游 warp-parse 镜像（tcp source，framing=len，强制 mTLS）
#   web     管理台（nginx 静态 + /api 反代到宿主上的 wist-ingest-ctrl）
#   ctrl    不在 compose 里：它是宿主 daemon（systemd），负责渲染配置、校验、重启 ingest。
#
# 端口（宿主:容器）：
#   ${INGEST_BIND_IP}:${INGEST_PORT}:6514   互联网入口（网关 → ingest）
#   ${WEB_BIND_IP}:${WEB_PORT}:80           管理台，默认只绑回环
#
# 运行身份：上游镜像 `USER wparse`（名字而非数字），这里显式钉 999:999。
# 宿主 bind 在 Linux 上不改属主，所以宿主侧必须 `gops sys perms` 对齐：
#   属主=部署账号、属组=999、只读 0640/2750、读写 0660/2770(setgid)。
# 缺失的挂载源会被 Docker 以 root 建成目录/文件 —— 由 scripts/init-ingest.sh 预建。
name: wist-ingest-stack

services:
  ingest:
    container_name: wist-ingest-stack-ingest
    image: ${WARP_SPC}/warp-parse:${WPARSE_TAG}
    restart: unless-stopped
    # 上游镜像 ENTRYPOINT=[wparse] CMD=[--help]；不写 command 会打印帮助后退出。
    # 子命令只能是 daemon / batch / version —— **没有 `work`**
    # （0.35.3-alpha 实测：`wparse work` → `error: unrecognized subcommand 'work'`，容器无限重启）。
    command: ["daemon"]
    user: "999:999"
    working_dir: /data
    environment:
      - TZ=${TZ}
    ports:
      - "${INGEST_BIND_IP}:${INGEST_PORT}:6514"
    volumes:
      # 工作根：conf/ connectors/ topology/ models/ data/ identity/ 都在这里
      - ./data-plane-run/work:/data
      # 站点身份只读挂载（server cert/key + 客户端 CA）
      - ./identity/ingest/trust:/data/identity/ingest:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 加固可选：确认 wparse 的写点全在 /data 下后再打开
    # （rescue / logs / out_dat 都在 data-plane-run/work 内）。
    # read_only: true
    # tmpfs:
    #   - /tmp

  # 控制面：wist-ingest-ctrl（与 wist-center 同构：**在容器里跑**，宿主只暴露回环端口）。
  # 它要 `docker exec` / `docker restart` 数据面容器，所以挂宿主 docker.sock；
  # 读 socket 需要能访问 docker 组的身份，这里直接用容器内 root（socket 等价宿主 root，如实标记）。
  ctrl:
    container_name: wist-ingest-stack-ctrl
    image: ${INGEST_SPC}/wist-ingest-ctrl:${INGEST_CTRL_TAG}
    restart: unless-stopped
    user: "0:0"
    # 镜像 ENTRYPOINT=[wist-ingest-ctrl] CMD=[--help]，不写 command 会打印帮助后退出。
    command: ["serve"]
    environment:
      - TZ=${TZ}
      # 配置与密钥都在挂载点里（密钥真值不入配置、不进镜像）。
      - INGEST_CTRL_CONFIG=/configs/ingest-ctrl.toml
      - INGEST_CTRL_SEC_FILE=/sec/sec-value.yml
    ports:
      # 仅供宿主调试（curl / 命令行）；web 走 compose 网络直连 ctrl:19091。
      - "127.0.0.1:19091:19091"
    volumes:
      # 现场渲染出的站点配置（来自 sys/configs/ingest-ctrl/，只补缺）
      - ./configs/ingest-ctrl:/configs:ro
      # 密钥文件（`ingest_ctrl_admin_token` 等），只读
      - ./.wist:/sec:ro
      # 数据面运行根：ctrl 往这里渲染 connectors/ + topology/，与 ingest 的 /data 是同一份
      - ./data-plane-run/work:/work
      # 站点身份（证书指纹 / 到期检查；管理面 TLS 的 server 证书）
      - ./identity:/identity:ro
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ingest

  web:
    container_name: wist-ingest-stack-web
    image: ${INGEST_SPC}/wist-ingest-web:${INGEST_WEB_TAG}
    restart: unless-stopped
    # ctrl 在同一 compose 网络里，nginx 直接代理到 `ctrl:19091`（mTLS）。
    ports:
      - "${WEB_BIND_IP}:${WEB_PORT}:443"
    volumes:
      # 站点身份（服务端证书 + 访问 ctrl 的客户端证书 + ctrl 的信任锚）
      - ./identity/web/tls:/etc/nginx/tls:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      - ctrl
