[[connectors]]
id = "file_json_sink"
type = "file"
allow_override = ["base", "file"]

[connectors.params]
base = "./data/out_dat"
file = "default.json"
fmt = "json"

[[connectors]]
id = "file_proto_sink"
type = "file"
allow_override = ["base", "file"]

[connectors.params]
base = "./data/out_dat"
file = "default.proto"
fmt = "proto-text"
