# wist-ingest-ctrl 站点配置
#
# 运行形态：**容器**（compose 里的 `ctrl` 服务，与 wist-center 同构），
# 因此这里的路径全是**容器内路径**，与 compose 的挂载一一对应：
#   /work                  ← ./data-plane-run/work      （= 数据面容器的 /data）
#   /identity              ← ./identity                 （ro）
#   /configs               ← ./configs/ingest-ctrl      （ro）
#   /sec/sec-value.yml     ← ./.wist/sec-value.yml      （ro）
#
# 本文件由 `scripts/init-ingest.sh` 从 `sys/configs/ingest-ctrl/` 复制到
# 栈根 `configs/ingest-ctrl/`（只补缺、不覆盖现场改动）。`configs/` 不入库、不进包。
#
# 秘密不进这个文件：`${SEC_INGEST_CTRL_ADMIN_TOKEN}` 由 ctrl 启动时从
# `INGEST_CTRL_SEC_FILE` 指向的密钥文件解析（键 `ingest_ctrl_admin_token`
# → `SEC_INGEST_CTRL_ADMIN_TOKEN`）。未解析会**拒绝启动**。

[ctrl]
# 容器内监听 0.0.0.0；宿主侧只映射到 127.0.0.1（web 走 compose 网络直连 ctrl）。
listen = "0.0.0.0:19091"

# 数据面运行根（= 数据面容器的 /data 的宿主侧目录，这里是容器内挂载点）。
work_root = "/work"
# 站点身份（容器内挂载点）。
identity_dir = "/identity/ingest/trust"
# 要管理的容器名（docker restart / docker exec 用，经 /var/run/docker.sock）。
container = "wist-ingest-stack-ingest"
container_workdir = "/data"

# 管理面鉴权（对齐 center：Bearer token + sha256 hash）。
[ctrl.auth]
admin_token = "${SEC_INGEST_CTRL_ADMIN_TOKEN}"
# viewer_token = "${SEC_INGEST_CTRL_VIEWER_TOKEN}"   # 可选：只读 token
allow_anonymous = false

# 管理面 TLS/mTLS：ctrl 当服务端，web 当客户端。
[ctrl.tls]
cert_file = "/identity/ctrl/tls/ctrl.pem"
key_file = "/identity/ctrl/tls/ctrl.key"
client_ca_file = "/identity/ctrl/tls/web-client-ca.pem"
allow_unauthenticated = false

# 数据面接入授权（gateway → ingest）：一次性接入券的 TTL 与交给网关的入口。
# 与 center 的控制面 link 同一套逻辑（短 TTL / 只存 sha256 / 明文只交付一次）。
# ctrl < 0.2.0 会忽略这一段（未知表不报错），升到 0.2.0+ 后才生效。
[ctrl.link]
ttl_seconds = 900
# 网关实际要连的数据面地址（host 可以是域名；IPv6 写 [2001:db8::1]:6514）。
# 留空则由 ingest.bind:port 推导；bind = 0.0.0.0 时管理台会提示先配这一项。
# advertise = "ingest.example.com:6514"

[ingest]
bind = "0.0.0.0"
port = 6514
# 强制 len 帧；line 会在多行日志上错帧。
framing = "len"

# 以下路径是**数据面容器内**路径（写进 wparse 配置，与 ctrl 自身无关）。
server_cert = "/data/identity/ingest/server.pem"
server_key = "/data/identity/ingest/server.key"
# 必填：不填 client_ca，wparse 的 tcp source 不会要求客户端证书（静默降级为单向 TLS）。
client_ca = "/data/identity/ingest/client-ca.pem"

# 网关台账（单端口模式下只用于审计/展示）。
[[gateways]]
name = "site-a"
tenant = "tenant-a"
