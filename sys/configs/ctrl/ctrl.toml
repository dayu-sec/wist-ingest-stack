# wist-ingest-ctrl 站点配置（宿主侧）
#
# 安装位置：/etc/wist-ingest/ctrl.toml（属主=部署账号，0640）
# 只放路径，不放私钥内容。

[ctrl]
listen = "127.0.0.1:19091"
# 站点安装目录；按现场路径调整（下面两个目录必须与 compose 的挂载一致）。
work_root = "/opt/wist-ingest/data-plane-run/work"
# compose 把 identity/ingest/trust 挂到 /data/identity/ingest，因此这里指到 trust/。
identity_dir = "/opt/wist-ingest/identity/ingest/trust"
container = "wist-ingest-stack-ingest"
container_workdir = "/data"

# 管理面鉴权（对齐 center：Bearer token + sha256 hash）。
# 生产：用 hash，不要在这里放明文 ——
#   printf '%s' '<token>' | shasum -a 256
[ctrl.auth]
admin_token = "change-me-in-site"     # 首次部署必须替换（或用 admin_token_hash）
# admin_token_hash = "<64位 sha256 hex>"
# viewer_token = "<只读 token>"
allow_anonymous = false

# 管理面 TLS/mTLS：与 gwlinkd↔Center 同构 —— ctrl 当服务端，web 当客户端。
[ctrl.tls]
cert_file = "/opt/wist-ingest/identity/ctrl/tls/ctrl.pem"
key_file = "/opt/wist-ingest/identity/ctrl/tls/ctrl.key"
client_ca_file = "/opt/wist-ingest/identity/ctrl/tls/web-client-ca.pem"
allow_unauthenticated = false

[ingest]
bind = "0.0.0.0"
port = 6514
framing = "len"
server_cert = "/data/identity/ingest/server.pem"
server_key = "/data/identity/ingest/server.key"
# 必填；留空 ctrl 会拒绝 apply（E001）。
client_ca = "/data/identity/ingest/client-ca.pem"

[[gateways]]
name = "site-a"
tenant = "tenant-a"
